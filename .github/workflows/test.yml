name: macOS tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: >-
          xcodebuild test -project MovieTagger.xcodeproj -scheme MovieTagger
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
